version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finwell-postgres
    restart: always
    environment:
      POSTGRES_DB: finwelldb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finwelldb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-spring-boot
      dockerfile: Dockerfile
    container_name: finwell-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finwelldb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      JWT_SECRET: finwell-production-docker-secret-2026
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finwell-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
